<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NZM Videoke Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      /* Premium 2-color Obsidian Navy & Dark Slate base matrix */
      background: radial-gradient(circle at top, #0f172a, #020617 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Premium Frosted Dark Glass Panel Styling */
    .glass {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    button, input {
      touch-action: manipulation;
    }

    /* Custom premium tracking layout for slider */
    input[type="range"]::-webkit-slider-thumb {
      background: #f59e0b;
    }
  </style>
</head>
<body class="p-4">

  <!-- Premium Login Screen Overlay -->
  <div id="loginScreen" class="fixed inset-0 z-50 grid place-items-center bg-slate-950 p-4">
    <div class="glass w-full max-w-md rounded-lg border border-amber-500/10 p-6 shadow-xl">
      <h1 class="mb-2 text-center text-2xl font-black tracking-tight text-amber-400">NZM REMOTE 🎤</h1>
      <p class="mb-5 text-center text-xs text-slate-400">Login using the same account credentials as your TV Player.</p>

      <div class="space-y-3">
        <input id="emailInput" class="w-full rounded-md bg-slate-950/80 p-3.5 text-sm ring-1 ring-white/10 focus:outline-none focus:ring-amber-500/40 transition" placeholder="Email Address" type="email">
        <input id="passwordInput" class="w-full rounded-md bg-slate-950/80 p-3.5 text-sm ring-1 ring-white/10 focus:outline-none focus:ring-amber-500/40 transition" placeholder="Password" type="password">
        <button id="loginBtn" class="w-full rounded-md bg-amber-500 p-3.5 text-sm font-black text-slate-950 shadow-lg shadow-amber-500/10 transition active:scale-[0.99]">Login / Create Account</button>
      </div>
      <p id="loginError" class="min-h-5 mt-3 text-center text-xs text-rose-400 font-semibold"></p>
    </div>
  </div>

  <!-- Primary System Interface Container -->
  <main class="mx-auto max-w-xl space-y-4 pb-8">
    
    <!-- Console Header System Component -->
    <header class="flex items-center justify-between gap-3 pt-2">
      <div>
        <p class="text-[10px] uppercase tracking-[0.25em] font-black text-amber-500/80">Wireless Controller</p>
        <h1 class="text-2xl font-black tracking-tight text-white">NZM Remote</h1>
      </div>

      <div class="rounded-md bg-black/40 px-3.5 py-1.5 text-right text-xs ring-1 ring-white/10 min-w-[75px]">
        <span class="text-[9px] uppercase tracking-wider text-slate-500 font-bold">Room</span><br>
        <b id="roomLabel" class="text-amber-400 tracking-wider font-black">----</b>
      </div>
    </header>

    <!-- Scanner Module -->
    <section class="glass rounded-lg border border-white/5 p-4 shadow-md">
      <button id="scanBtn" class="w-full rounded-md bg-amber-500 p-3.5 text-xs font-black uppercase tracking-wider text-slate-950 shadow-md transition active:scale-[0.99]">
        📷 Scan TV QR Code
      </button>

      <div id="readerWrap" class="hidden">
        <div id="reader" class="overflow-hidden rounded-md bg-black mt-3 border border-white/10"></div>
        <button id="stopScanBtn" class="mt-3 w-full rounded-md bg-slate-800 p-3 text-xs font-bold text-slate-300">
          Stop Scanner Pipeline
        </button>
      </div>

      <p id="connectStatus" class="mt-3 rounded-md bg-black/20 p-3 text-center text-xs text-slate-400 ring-1 ring-white/5">
        Not connected yet. Scan the active TV QR to link controls.
      </p>
    </section>

    <!-- Search Engine Section -->
    <section class="glass rounded-lg border border-white/5 p-4 shadow-md space-y-3">
      <div>
        <label class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-1.5">1. Identify Performer</label>
        <input id="singerInput" class="w-full rounded-md bg-slate-950 p-3.5 text-sm ring-1 ring-white/10 focus:outline-none focus:ring-amber-500/40 transition" placeholder="Enter singer name (e.g., John)">
      </div>

      <div class="space-y-2">
        <label class="text-[10px] uppercase font-bold tracking-wider text-slate-400 block mb-0.5">2. Find Videoke Track</label>
        <input id="searchInput" class="w-full rounded-md bg-slate-950 p-3.5 text-sm ring-1 ring-white/10 focus:outline-none focus:ring-amber-500/40 transition" placeholder="Search song title or tracks...">
        <!-- Search button positioned below the search input field -->
        <button id="searchBtn" class="w-full rounded-md bg-slate-100 p-3.5 text-xs font-black uppercase tracking-wider text-slate-950 shadow-md transition active:scale-[0.99]">
          🔍 Execute Song Query
        </button>
      </div>
    </section>

    <!-- Dynamic Streaming Response Node Outputs -->
    <section id="resultsCard" class="glass hidden rounded-lg border border-white/5 p-4 shadow-md">
      <h2 class="mb-3 text-sm font-black uppercase tracking-wider text-amber-400">Search Results</h2>
      <div id="results" class="space-y-3"></div>
    </section>

    <!-- Master Command Framework Controls Deck -->
    <section class="glass rounded-lg border border-white/5 p-4 shadow-md">
      <h2 class="mb-3 text-sm font-black uppercase tracking-wider text-slate-400">Master Deck Deck Controls</h2>

      <div class="grid grid-cols-2 gap-2.5">
        <button data-command="play" class="cmd rounded-md bg-zinc-900 border border-zinc-800 p-4 text-xs font-black uppercase tracking-wider text-white shadow-sm transition active:scale-[0.97]">▶ Play / Resume</button>
        <button data-command="pause" class="cmd rounded-md bg-zinc-900 border border-zinc-800 p-4 text-xs font-black uppercase tracking-wider text-white shadow-sm transition active:scale-[0.97]">|| Pause</button>
        <button data-command="replay" class="cmd rounded-md bg-zinc-900 border border-zinc-800 p-4 text-xs font-black uppercase tracking-wider text-white shadow-sm transition active:scale-[0.97]">↺ Replay Track</button>
        <button data-command="next" class="cmd rounded-md bg-amber-500 p-4 text-xs font-black uppercase tracking-wider text-slate-950 shadow-md transition active:scale-[0.97]">Skip Track ≫</button>
      </div>

      <div class="mt-4 pt-2 border-t border-white/5">
        <div class="flex items-center justify-between text-xs font-bold text-slate-400 mb-1">
          <span>Master Volume Pipeline</span>
          <span class="text-amber-400 font-black"><span id="volumeText">80</span>%</span>
        </div>
        <input id="volumeRange" type="range" min="0" max="100" value="80" class="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-amber-500">
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCFUZe8BZKPzU5E_es0Gv5xsqkliB3tTes",
      authDomain: "admin-panel-87530.firebaseapp.com",
      databaseURL: "https://admin-panel-87530-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "admin-panel-87530",
      storageBucket: "admin-panel-87530.firebasestorage.app",
      messagingSenderId: "1065643470010",
      appId: "1:1065643470010:web:ea79e85fef283dfb05a683",
      measurementId: "G-YSCLM1KL0Z"
    };

    const YOUTUBE_API_KEYS = [
      "AIzaSyCjypKwyZIFnC9W0PfmlnPOQWTKcDudhEc", 
      "AIzaSyBVYySTZ9YR3b23mcQzVW5RUkUABXYz_oM",  
      "AIzaSyCNzXtnarTdhSQ0y1Sgp8muD8TDG3L8Y44",
      "AIzaSyAqzpP979rkPhdc5RsU1974Uuy-OqAf1uU",
      "AIzaSyA7ypKhNxbkVvQaidoQ504TquVLDB63TqE",
      "AIzaSyDqEzRoNxH_p3eB-XZs6qjGp4R69AlzVFc",
      "AIzaSyAW7qXn34FovdT7Oprv0niuiL5JIT35SAA",
      "AIzaSyAFXj4V2TYrlL4zM0iiZ807LpLQYCIwyN0",
      "AIzaSyCOFzkGhAloob6bl3tib-ebkKRiVTMOygM",
      "AIzaSyC4kQfS95f9xS-SxvDASl-QSc1OTdEpZoQ"
    ];

    let currentKeyIndex = 0;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    const urlParams = new URLSearchParams(location.search);
    let roomId = urlParams.get("room") || localStorage.getItem("nzmRoom") || "";
    let ownerUid = urlParams.get("owner") || localStorage.getItem("nzmOwnerUid") || "";
    let qrScanner = null;
    let volumeTimer = null;

    if (ownerUid) {
      localStorage.setItem("nzmOwnerUid", ownerUid);
    }

    setRoom(roomId);

    function setRoom(nextRoom) {
      roomId = (nextRoom || "").trim();
      if (roomId) {
        localStorage.setItem("nzmRoom", roomId);
        const ownerParam = ownerUid ? `&owner=${encodeURIComponent(ownerUid)}` : "";
        history.replaceState(null, "", `?room=${encodeURIComponent(roomId)}${ownerParam}`);
      }
      document.getElementById("roomLabel").textContent = roomId || "----";
      updateConnectionStatus();
    }

    function updateConnectionStatus() {
      const el = document.getElementById("connectStatus");
      if (!el) return;

      if (roomId && ownerUid) {
        el.textContent = "✓ Connected to TV Room Pipeline. Interface Armed.";
        el.className = "mt-3 rounded-md bg-emerald-500/10 p-3 text-center text-xs font-semibold text-emerald-400 ring-1 ring-emerald-500/20";
      } else if (roomId && !ownerUid) {
        el.textContent = "Room ID active, missing engine owner identity. Rescan TV QR.";
        el.className = "mt-3 rounded-md bg-amber-500/10 p-3 text-center text-xs font-semibold text-amber-400 ring-1 ring-amber-500/20";
      } else {
        el.textContent = "Not connected yet. Scan the TV QR window.";
        el.className = "mt-3 rounded-md bg-black/20 p-3 text-center text-xs text-slate-400 ring-1 ring-white/5";
      }
    }

    function roomRef(path = "") {
      if (!currentUser) throw new Error("Authentication context invalid.");
      if (!roomId) throw new Error("Scan TV QR sequence initialization incomplete.");
      if (!ownerUid) throw new Error("Owner identity hash context missing.");
      return ref(db, `users/${ownerUid}/rooms/${roomId}${path ? "/" + path : ""}`);
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>'"]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      }[c]));
    }

    function thumbnail(videoId) {
      return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    }

    async function loginOrCreate() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const err = document.getElementById("loginError");
      err.textContent = "";

      if (!email || !password) {
        err.textContent = "Credentials verification structural fault.";
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (loginError) {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
        } catch (createError) {
          err.textContent = createError.message || "Registration failed.";
        }
      }
    }

    document.getElementById("loginBtn").addEventListener("click", loginOrCreate);
    document.getElementById("passwordInput").addEventListener("keydown", e => {
      if (e.key === "Enter") loginOrCreate();
    });

    onAuthStateChanged(auth, user => {
      if (!user) {
        document.getElementById("loginScreen").style.display = "grid";
        return;
      }
      currentUser = user;
      document.getElementById("loginScreen").style.display = "none";
      updateConnectionStatus();
    });

    async function sendCommand(type, extra = {}) {
      if (!roomId) {
        alert("Scan the TV QR framework system first.");
        return false;
      }
      try {
        const command = {
          type,
          ...extra,
          commandId: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          sentBy: currentUser ? currentUser.uid : "remote",
          createdAt: Date.now()
        };
        await set(push(roomRef("commands")), command);
        return true;
      } catch (error) {
        alert(error.message);
        return false;
      }
    }

    async function searchYouTube(query) {
      for (let attempts = 0; attempts < YOUTUBE_API_KEYS.length; attempts++) {
        const activeKey = YOUTUBE_API_KEYS[currentKeyIndex];
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({
          key: activeKey,
          part: "snippet",
          q: `${query} karaoke videoke lyrics`,
          type: "video",
          videoEmbeddable: "true",
          maxResults: "8"
        });

        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data.error) {
            currentKeyIndex = (currentKeyIndex + 1) % YOUTUBE_API_KEYS.length;
            continue; 
          }
          return (data.items || []).map(item => ({
            videoId: item.id.videoId,
            title: item.snippet.title,
            channelTitle: item.snippet.channelTitle,
            thumbnail: item.snippet.thumbnails?.medium?.url || thumbnail(item.id.videoId)
          }));
        } catch (err) {
          currentKeyIndex = (currentKeyIndex + 1) % YOUTUBE_API_KEYS.length;
        }
      }
      throw new Error("All access gateways are heavily throttled. Re-attempt query shortly.");
    }

    function makeSongPayload(song) {
      return {
        videoId: song.videoId,
        title: song.title,
        channelTitle: song.channelTitle || "",
        thumbnail: song.thumbnail || thumbnail(song.videoId),
        singer: document.getElementById("singerInput").value.trim() || "Guest Singer",
        createdAt: Date.now()
      };
    }

    async function playNowSong(song) {
      if (!roomId) {
        alert("Scan the TV QR engine component.");
        return false;
      }
      const payload = makeSongPayload(song);
      try {
        await set(roomRef("nowPlaying"), { ...payload, startedAt: Date.now() });
        const ok = await sendCommand("playVideo", payload);
        setTimeout(() => { sendCommand("play"); }, 450);
        return ok;
      } catch (error) {
        alert(error.message);
        return false;
      }
    }

    async function addSong(song) {
      if (!roomId) {
        alert("Scan the TV QR alignment target.");
        return false;
      }
      try {
        await set(push(roomRef("queue")), makeSongPayload(song));
        return true;
      } catch (error) {
        alert(error.message);
        return false;
      }
    }

    async function doSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) return;

      const card = document.getElementById("resultsCard");
      const resultsEl = document.getElementById("results");

      card.classList.remove("hidden");
      resultsEl.innerHTML = `<p class="text-xs font-semibold text-amber-400/70 animate-pulse">Running catalog index search...</p>`;

      try {
        const results = await searchYouTube(query);
        if (!results.length) {
          resultsEl.innerHTML = `<p class="text-xs text-slate-400">Zero database matching instances recorded.</p>`;
          return;
        }

        resultsEl.innerHTML = results.map(song => `
          <article class="flex gap-3 rounded-md bg-slate-950/80 p-3 ring-1 ring-white/5 shadow-inner">
            <img src="${song.thumbnail}" class="h-16 w-24 rounded object-cover border border-white/5" />
            <div class="min-w-0 flex-1">
              <h3 class="line-clamp-2 text-xs font-bold leading-tight text-slate-100">${escapeHtml(song.title)}</h3>
              <p class="mt-1 truncate text-[10px] text-slate-500 font-medium">${escapeHtml(song.channelTitle)}</p>
              <div class="mt-2.5 grid grid-cols-2 gap-2">
                <button class="addSong rounded-md bg-amber-500 p-2 text-[10px] font-black uppercase tracking-wider text-slate-950" data-song='${escapeHtml(JSON.stringify(song))}'>
                  Queue
                </button>
                <button class="playNow rounded-md bg-slate-800 border border-slate-700 p-2 text-[10px] font-black uppercase tracking-wider text-white" data-song='${escapeHtml(JSON.stringify(song))}'>
                  Cut To Play
                </button>
              </div>
            </div>
          </article>
        `).join("");

        document.querySelectorAll(".addSong").forEach(btn => {
          btn.addEventListener("click", async () => {
            const ok = await addSong(JSON.parse(btn.dataset.song));
            if (ok) { btn.textContent = "Queued ✓"; btn.disabled = true; btn.className = "rounded-md bg-emerald-950/40 text-emerald-400 border border-emerald-500/20 p-2 text-[10px] font-bold uppercase cursor-default"; }
          });
        });

        document.querySelectorAll(".playNow").forEach(btn => {
          btn.addEventListener("click", async () => {
            const ok = await playNowSong(JSON.parse(btn.dataset.song));
            if (ok) { btn.textContent = "Rendering ✓"; btn.disabled = true; btn.className = "rounded-md bg-emerald-950/40 text-emerald-400 border border-emerald-500/20 p-2 text-[10px] font-bold uppercase cursor-default"; }
          });
        });

      } catch (error) {
        resultsEl.innerHTML = `<p class="text-xs text-rose-400 font-semibold">${escapeHtml(error.message)}</p>`;
      }
    }

    function parseRoomFromQr(decodedText) {
      try {
        const url = new URL(decodedText);
        return url.searchParams.get("room") || "";
      } catch {
        return decodedText.trim();
      }
    }

    async function startScanner() {
      document.getElementById("readerWrap").classList.remove("hidden");
      qrScanner = new Html5Qrcode("reader");
      await qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async decodedText => {
          const scannedRoom = parseRoomFromQr(decodedText);
          try {
            const scannedUrl = new URL(decodedText);
            const scannedOwner = scannedUrl.searchParams.get("owner") || "";
            if (scannedOwner) {
              ownerUid = scannedOwner;
              localStorage.setItem("nzmOwnerUid", ownerUid);
            }
          } catch {}
          if (scannedRoom) { setRoom(scannedRoom); }
          await stopScanner();
        }
      );
    }

    async function stopScanner() {
      if (qrScanner) {
        await qrScanner.stop().catch(() => {});
        await qrScanner.clear().catch(() => {});
        qrScanner = null;
      }
      document.getElementById("readerWrap").classList.add("hidden");
    }

    document.getElementById("scanBtn").addEventListener("click", startScanner);
    document.getElementById("stopScanBtn").addEventListener("click", stopScanner);
    document.getElementById("searchBtn").addEventListener("click", doSearch);
    document.getElementById("searchInput").addEventListener("keydown", e => {
      if (e.key === "Enter") doSearch();
    });

    document.querySelectorAll(".cmd").forEach(btn => {
      btn.addEventListener("click", async () => {
        const originalText = btn.textContent;
        const ok = await sendCommand(btn.dataset.command);
        if (ok) {
          btn.textContent = "Dispatched ✓";
          setTimeout(() => { btn.textContent = originalText; }, 650);
        }
      });
    });

    document.getElementById("volumeRange").addEventListener("input", e => {
      document.getElementById("volumeText").textContent = e.target.value;
      clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        sendCommand("volume", { value: Number(e.target.value) });
      }, 120);
    });
  </script>
</body>
</html>
