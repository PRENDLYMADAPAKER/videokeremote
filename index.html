<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NZM Videoke Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, #4c1d95, #020617 58%);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .glass {
      background: rgba(15,23,42,.84);
      backdrop-filter: blur(18px);
    }
    button, input {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="p-4">
  <div id="loginScreen" class="fixed inset-0 z-50 grid place-items-center bg-slate-950 p-4">
    <div class="glass w-full max-w-md rounded-3xl border border-white/10 p-6">
      <h1 class="mb-2 text-center text-3xl font-black">NZM REMOTE 🎤</h1>
      <p class="mb-5 text-center text-sm text-slate-300">Login using the same account as the TV.</p>

      <input id="emailInput" class="mb-3 w-full rounded-2xl bg-slate-950 p-4 ring-1 ring-white/10" placeholder="Email" type="email" />
      <input id="passwordInput" class="mb-3 w-full rounded-2xl bg-slate-950 p-4 ring-1 ring-white/10" placeholder="Password" type="password" />

      <button id="loginBtn" class="mb-3 w-full rounded-2xl bg-fuchsia-500 p-4 font-black">Login / Create Account</button>
      <p id="loginError" class="min-h-5 text-center text-sm text-red-300"></p>
    </div>
  </div>

  <main class="mx-auto max-w-xl space-y-4 pb-8">
    <header class="flex items-center justify-between gap-3">
      <div>
        <p class="text-xs uppercase tracking-[0.28em] text-fuchsia-300">Phone Controller</p>
        <h1 class="text-3xl font-black">NZM Remote</h1>
      </div>

      <div class="rounded-2xl bg-black/30 px-3 py-2 text-right text-xs ring-1 ring-white/10">
        Room<br>
        <b id="roomLabel">----</b>
      </div>
    </header>

    <section class="glass rounded-3xl border border-white/10 p-4">
      <button id="scanBtn" class="mb-3 w-full rounded-2xl bg-emerald-500 p-4 font-black text-slate-950">
        Scan TV QR Code
      </button>

      <div id="readerWrap" class="hidden">
        <div id="reader" class="overflow-hidden rounded-2xl bg-black"></div>
        <button id="stopScanBtn" class="mt-3 w-full rounded-2xl bg-slate-700 p-3 font-bold">
          Stop Scanner
        </button>
      </div>

      <p class="text-center text-xs text-slate-400">You can also scan the TV QR using your camera app.</p>
      <p id="connectStatus" class="mt-3 rounded-xl bg-black/30 p-3 text-center text-xs text-slate-300 ring-1 ring-white/10">
        Not connected yet. Scan the TV QR.
      </p>
    </section>

    <section class="glass rounded-3xl border border-white/10 p-4">
      <input id="singerInput" class="mb-3 w-full rounded-2xl bg-slate-950 p-4 ring-1 ring-white/10" placeholder="Singer name" />

      <div class="grid grid-cols-[1fr_auto] gap-2">
        <input id="searchInput" class="rounded-2xl bg-slate-950 p-4 ring-1 ring-white/10" placeholder="Search song..." />
        <button id="searchBtn" class="rounded-2xl bg-fuchsia-500 px-5 font-black">Search</button>
      </div>
    </section>

    <section id="resultsCard" class="glass hidden rounded-3xl border border-white/10 p-4">
      <h2 class="mb-3 text-xl font-black">Search Results</h2>
      <div id="results" class="space-y-3"></div>
    </section>

    <section class="glass rounded-3xl border border-white/10 p-4">
      <h2 class="mb-3 text-xl font-black">Controls</h2>

      <div class="grid grid-cols-2 gap-3">
        <button data-command="play" class="cmd rounded-2xl bg-white p-5 text-lg font-black text-slate-950">▶ Play / Start</button>
        <button data-command="pause" class="cmd rounded-2xl bg-white p-5 text-lg font-black text-slate-950">⏸ Pause</button>
        <button data-command="replay" class="cmd rounded-2xl bg-white p-5 text-lg font-black text-slate-950">↺ Replay</button>
        <button data-command="next" class="cmd rounded-2xl bg-fuchsia-500 p-5 text-lg font-black">Next</button>
      </div>

      <div class="mt-4">
        <label class="text-sm text-slate-300">Volume <span id="volumeText">80</span>%</label>
        <input id="volumeRange" type="range" min="0" max="100" value="80" class="mt-2 w-full accent-fuchsia-500" />
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCFUZe8BZKPzU5E_es0Gv5xsqkliB3tTes",
      authDomain: "admin-panel-87530.firebaseapp.com",
      databaseURL: "https://admin-panel-87530-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "admin-panel-87530",
      storageBucket: "admin-panel-87530.firebasestorage.app",
      messagingSenderId: "1065643470010",
      appId: "1:1065643470010:web:ea79e85fef283dfb05a683",
      measurementId: "G-YSCLM1KL0Z"
    };

    const YOUTUBE_API_KEY = "AIzaSyCjypKwyZIFnC9W0PfmlnPOQWTKcDudhEc";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    const urlParams = new URLSearchParams(location.search);
    let roomId = urlParams.get("room") || localStorage.getItem("nzmRoom") || "";
    let ownerUid = urlParams.get("owner") || localStorage.getItem("nzmOwnerUid") || "";
    let qrScanner = null;

    if (ownerUid) {
      localStorage.setItem("nzmOwnerUid", ownerUid);
    }

    setRoom(roomId);

    function setRoom(nextRoom) {
      roomId = (nextRoom || "").trim();

      if (roomId) {
        localStorage.setItem("nzmRoom", roomId);
        const ownerParam = ownerUid ? `&owner=${encodeURIComponent(ownerUid)}` : "";
        history.replaceState(null, "", `?room=${encodeURIComponent(roomId)}${ownerParam}`);
      }

      document.getElementById("roomLabel").textContent = roomId || "----";
      updateConnectionStatus();
      console.log("Remote room:", roomId);
      console.log("TV owner UID:", ownerUid);
    }

    function updateConnectionStatus() {
      const el = document.getElementById("connectStatus");
      if (!el) return;

      if (roomId && ownerUid) {
        el.textContent = "Connected to TV room. Controls are ready.";
        el.className = "mt-3 rounded-xl bg-emerald-500/20 p-3 text-center text-xs text-emerald-200 ring-1 ring-emerald-400/30";
      } else if (roomId && !ownerUid) {
        el.textContent = "Room found, but TV owner is missing. Scan the new TV QR again.";
        el.className = "mt-3 rounded-xl bg-yellow-500/20 p-3 text-center text-xs text-yellow-200 ring-1 ring-yellow-400/30";
      } else {
        el.textContent = "Not connected yet. Scan the TV QR.";
        el.className = "mt-3 rounded-xl bg-black/30 p-3 text-center text-xs text-slate-300 ring-1 ring-white/10";
      }
    }

    function roomRef(path = "") {
      if (!currentUser) throw new Error("Login first.");
      if (!roomId) throw new Error("Scan the TV QR code first.");
      if (!ownerUid) throw new Error("Owner UID missing. Scan the new TV QR code again.");

      return ref(db, `users/${ownerUid}/rooms/${roomId}${path ? "/" + path : ""}`);
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>'"]/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[c]));
    }

    function thumbnail(videoId) {
      return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    }

    async function loginOrCreate() {
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const err = document.getElementById("loginError");

      err.textContent = "";

      if (!email || !password) {
        err.textContent = "Enter email and password.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (loginError) {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
        } catch (createError) {
          err.textContent = createError.message;
        }
      }
    }

    document.getElementById("loginBtn").addEventListener("click", loginOrCreate);

    document.getElementById("passwordInput").addEventListener("keydown", e => {
      if (e.key === "Enter") loginOrCreate();
    });

    onAuthStateChanged(auth, user => {
      if (!user) return;

      currentUser = user;
      document.getElementById("loginScreen").style.display = "none";

      updateConnectionStatus();
      console.log("Remote logged in UID:", currentUser.uid);
      console.log("Remote writing at:", ownerUid ? `users/${ownerUid}/rooms/${roomId}` : "Owner UID missing. Re-scan TV QR.");
    });

    async function sendCommand(type, extra = {}) {
      if (!roomId) {
        alert("Scan the TV QR code first.");
        return;
      }

      try {
        await set(push(roomRef("commands")), {
          type,
          ...extra,
          createdAt: Date.now()
        });

        console.log("Command sent:", type, extra);
      } catch (error) {
        alert(error.message);
      }
    }

    async function searchYouTube(query) {
      const url = new URL("https://www.googleapis.com/youtube/v3/search");

      url.search = new URLSearchParams({
        key: YOUTUBE_API_KEY,
        part: "snippet",
        q: `${query} karaoke videoke lyrics`,
        type: "video",
        videoEmbeddable: "true",
        maxResults: "8"
      });

      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        throw new Error(data.error.message || "YouTube API error.");
      }

      return (data.items || []).map(item => ({
        videoId: item.id.videoId,
        title: item.snippet.title,
        channelTitle: item.snippet.channelTitle,
        thumbnail: item.snippet.thumbnails?.medium?.url || thumbnail(item.id.videoId)
      }));
    }

    async function addSong(song) {
      if (!roomId) {
        alert("Scan the TV QR code first.");
        return;
      }

      const singer = document.getElementById("singerInput").value.trim() || "Guest";

      try {
        await set(push(roomRef("queue")), {
          videoId: song.videoId,
          title: song.title,
          channelTitle: song.channelTitle || "",
          thumbnail: song.thumbnail || thumbnail(song.videoId),
          singer,
          createdAt: Date.now()
        });

        alert("Added to TV queue.");
      } catch (error) {
        alert(error.message);
      }
    }

    async function doSearch() {
      const query = document.getElementById("searchInput").value.trim();

      if (!query) return;

      const card = document.getElementById("resultsCard");
      const resultsEl = document.getElementById("results");

      card.classList.remove("hidden");
      resultsEl.innerHTML = `<p class="text-slate-300">Searching...</p>`;

      try {
        const results = await searchYouTube(query);

        if (!results.length) {
          resultsEl.innerHTML = `<p class="text-slate-300">No results found.</p>`;
          return;
        }

        resultsEl.innerHTML = results.map(song => `
          <article class="flex gap-3 rounded-2xl bg-slate-950/70 p-3 ring-1 ring-white/10">
            <img src="${song.thumbnail}" class="h-20 w-28 rounded-xl object-cover" />
            <div class="min-w-0 flex-1">
              <h3 class="line-clamp-2 font-bold">${escapeHtml(song.title)}</h3>
              <p class="mt-1 truncate text-xs text-slate-400">${escapeHtml(song.channelTitle)}</p>
              <button class="addSong mt-3 w-full rounded-xl bg-emerald-500 p-3 font-black text-slate-950" data-song='${escapeHtml(JSON.stringify(song))}'>
                Add to TV Queue
              </button>
              <button class="playNow mt-2 w-full rounded-xl bg-fuchsia-500 p-3 font-black" data-song='${escapeHtml(JSON.stringify(song))}'>
                Play Now
              </button>
            </div>
          </article>
        `).join("");

        document.querySelectorAll(".addSong").forEach(btn => {
          btn.addEventListener("click", async () => {
            await addSong(JSON.parse(btn.dataset.song));
            btn.textContent = "Added ✓";
          });
        });

        document.querySelectorAll(".playNow").forEach(btn => {
          btn.addEventListener("click", async () => {
            const song = JSON.parse(btn.dataset.song);

            await sendCommand("playVideo", {
              videoId: song.videoId,
              title: song.title,
              channelTitle: song.channelTitle || "",
              thumbnail: song.thumbnail || thumbnail(song.videoId),
              singer: document.getElementById("singerInput").value.trim() || "Guest"
            });

            btn.textContent = "Playing ✓";
          });
        });

      } catch (error) {
        resultsEl.innerHTML = `<p class="text-red-300">${escapeHtml(error.message)}</p>`;
      }
    }

    function parseRoomFromQr(decodedText) {
      try {
        const url = new URL(decodedText);
        return url.searchParams.get("room") || "";
      } catch {
        return decodedText.trim();
      }
    }

    async function startScanner() {
      document.getElementById("readerWrap").classList.remove("hidden");

      qrScanner = new Html5Qrcode("reader");

      await qrScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        async decodedText => {
          const scannedRoom = parseRoomFromQr(decodedText);

          try {
            const scannedUrl = new URL(decodedText);
            const scannedOwner = scannedUrl.searchParams.get("owner") || "";
            if (scannedOwner) {
              ownerUid = scannedOwner;
              localStorage.setItem("nzmOwnerUid", ownerUid);
            }
          } catch {}

          if (scannedRoom) {
            setRoom(scannedRoom);
          }

          await stopScanner();
        }
      );
    }

    async function stopScanner() {
      if (qrScanner) {
        await qrScanner.stop().catch(() => {});
        await qrScanner.clear().catch(() => {});
        qrScanner = null;
      }

      document.getElementById("readerWrap").classList.add("hidden");
    }

    document.getElementById("scanBtn").addEventListener("click", startScanner);
    document.getElementById("stopScanBtn").addEventListener("click", stopScanner);

    document.getElementById("searchBtn").addEventListener("click", doSearch);

    document.getElementById("searchInput").addEventListener("keydown", e => {
      if (e.key === "Enter") doSearch();
    });

    document.querySelectorAll(".cmd").forEach(btn => {
      btn.addEventListener("click", () => sendCommand(btn.dataset.command));
    });

    document.getElementById("volumeRange").addEventListener("input", e => {
      document.getElementById("volumeText").textContent = e.target.value;

      sendCommand("volume", {
        value: Number(e.target.value)
      });
    });
  </script>
</body>
</html>
